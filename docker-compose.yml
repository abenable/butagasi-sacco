# Butagasi Sacco web app (Coolify: Docker Compose build pack)
#
# Talks to the Apache Fineract backend in ~/fineract on the same server. Caddy serves both at
# https://sacco.byte10x.dev: /fineract-provider/* -> Fineract (127.0.0.1:18080), rest -> this container.
# The browser calls the API on the same origin, so no CORS or container networking is needed.
# Every value below can be overridden from Coolify's Environment Variables tab.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ENVIRONMENT_OPTIONS=--configuration production
        - BUILDER_IMAGE=node:24-alpine3.23
        - NGINX_IMAGE=nginx:1.31.6-alpine3.24
        - NPM_REGISTRY_URL=https://registry.npmjs.org/
        - PUPPETEER_SKIP_DOWNLOAD_ARG=true
    restart: unless-stopped
    # Localhost only: Caddy is the public entry point (sacco.byte10x.dev block in /etc/caddy/Caddyfile)
    ports:
      - '127.0.0.1:14200:80'
    environment:
      - FINERACT_API_URLS=${FINERACT_API_URLS:-https://sacco.byte10x.dev}
      - FINERACT_API_URL=${FINERACT_API_URL:-https://sacco.byte10x.dev}
      - FINERACT_API_PROVIDER=/fineract-provider/api
      - FINERACT_API_VERSION=/v1
      - FINERACT_PLATFORM_TENANT_IDENTIFIER=${FINERACT_PLATFORM_TENANT_IDENTIFIER:-default}
      # Staff must not be able to point the app at another server from the login page
      - MIFOS_ALLOW_SERVER_SWITCH_SELECTOR=false
      - MIFOS_DEFAULT_LANGUAGE=en-US
      - MIFOS_SUPPORTED_LANGUAGES=az-AZ,cs-CS,de-DE,en-US,es-MX,es-CL,fr-FR,it-IT,ko-KO,lt-LT,lv-LV,ne-NE,pt-PT,sw-SW
      - MIFOS_SESSION_IDLE_TIMEOUT=300000
      - MIFOS_PRELOAD_CLIENTS=true
      - MIFOS_DEFAULT_CHAR_DELIMITER=,
      - MIFOS_ENABLE_COPILOT=false
      - MIFOS_COPILOT_MCP_BASE_URL=
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
