server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # env.js is generated from environment variables at container start and keeps the same
    # name across deploys, so Cloudflare/browsers must never cache it (they cache .js for 4h by default)
    location = /assets/env.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
